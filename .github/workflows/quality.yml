name: Tests de sécurité et qualité

on:
  push:
    branches:
      - main
      - 'codex/**'
      - 'hardening/**'
    # Toute autre modification reste couverte, y compris de futurs modules.
    paths-ignore:
      - state.json
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Vérifier la syntaxe
        run: python -m compileall -q poster.py cadence_simulator.py newsbot tools tests
      - name: Lancer les tests sans Telegram
        run: python -m unittest discover -s tests -v
