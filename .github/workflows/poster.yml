name: Poster news

on:
  schedule:
    # Essai 48 h : toutes les 15 minutes, en évitant :00.
    - cron: "2,17,32,47 * * * *"
  workflow_dispatch:

concurrency:
  group: poster-production
  cancel-in-progress: false
  queue: max

permissions:
  contents: write
  actions: read

jobs:
  poster:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Récupérer le code de production
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Vérifier le passage précédent
        id: health
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/persistence_health.py gate >> "$GITHUB_OUTPUT"
      - name: Contrôler la persistance sans Telegram
        id: probe
        if: steps.health.outputs.mode == 'recovery' || steps.health.outputs.mode == 'degraded'
        run: python tools/persistence_health.py probe
      - name: Vérifier la sonde distante avant publication dégradée
        id: checkpoint
        if: steps.health.outputs.mode == 'degraded' && steps.probe.outcome == 'success'
        run: python tools/persistence_health.py sync
      - name: Publier les articles
        id: publish
        if: steps.health.outputs.mode == 'normal' || (steps.health.outputs.mode == 'degraded' && steps.checkpoint.outcome == 'success')
        run: python poster.py
        env:
          DRY_RUN: "0"
          ALLOW_TELEGRAM_SEND: "1"
          PERSISTENCE_MODE: ${{ steps.health.outputs.mode }}
          TELEGRAM_INTERVAL_SECONDS: ${{ vars.TELEGRAM_INTERVAL_SECONDS || '30' }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
      - name: Sauvegarder l'état de la file d'attente
        if: always() && steps.health.outcome == 'success' && (steps.publish.outcome != 'skipped' || (steps.health.outputs.mode == 'recovery' && steps.probe.outcome == 'success'))
        run: python tools/persistence_health.py sync
