name: Poster news

on:
  schedule:
    # GitHub Actions ne descend pas sous 5 minutes ; le décalage évite :00.
    - cron: "2/5 * * * *"
  workflow_dispatch:

concurrency:
  group: poster-production
  cancel-in-progress: false
  queue: max

permissions:
  contents: write

jobs:
  poster:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Récupérer le code de production
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Publier les articles
        run: python poster.py
        env:
          DRY_RUN: "0"
          ALLOW_TELEGRAM_SEND: "1"
          TELEGRAM_INTERVAL_SECONDS: ${{ vars.TELEGRAM_INTERVAL_SECONDS || '30' }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
      - name: Sauvegarder l'état de la file d'attente
        if: always()
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json
          if git diff --cached --quiet; then
            echo "Aucun changement d'état à enregistrer."
            exit 0
          fi
          git commit -m "État du bot"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            sleep 5
          done
          echo "Impossible de sauvegarder state.json après 5 tentatives."
          exit 1
