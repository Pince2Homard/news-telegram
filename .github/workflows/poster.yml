name: Simulation news (aucun envoi)

on:
  workflow_dispatch:

concurrency:
  group: poster-hardening-dry-run
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Récupérer uniquement la branche de test
        uses: actions/checkout@v4
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Simuler la collecte et la file d'attente
        run: python poster.py
        env:
          DRY_RUN: "1"
          STATE_FILE: state.json
          FEEDS_FILE: feeds.txt
